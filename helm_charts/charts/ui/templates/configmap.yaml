kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Values.configmap.name }}
data:
  spring.security.oauth2.client.provider.keycloak.issuer-uri: {{ tpl .Values.configmap.data.PROVIDER_KEYCLOAK_ISSUER_URL . | quote }}
  USER_CLIENT_BASE_URL: {{ tpl .Values.configmap.data.USER_CLIENT_BASE_URL . | quote }}
  TRANSFER_CLIENT_BASE_URL: {{ tpl .Values.configmap.data.TRANSFER_CLIENT_BASE_URL . | quote }}
  CASH_CLIENT_BASE_URL: {{ tpl .Values.configmap.data.CASH_CLIENT_BASE_URL . | quote }}
  EXCHANGE_CLIENT_BASE_URL: {{ tpl .Values.configmap.data.EXCHANGE_CLIENT_BASE_URL . | quote }}
  spring.kafka.bootstrap-servers: {{ tpl .Values.configmap.data.KAFKA_BOOTSTRAP_SERVERS . | quote }}
  management.zipkin.tracing.endpoint: {{ tpl .Values.configmap.data.ZIPKIN_TRACING_ENDPOINT . | quote }}
  management.tracing.sampling.probability: {{ .Values.configmap.data.ZIPKIN_SAMPLING_PROBABILITY | quote }}
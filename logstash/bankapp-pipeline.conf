input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["accounts-logs", "blocker-logs", "cash-logs", "exchange-logs", "exchange-generator-logs", "notifications-logs", "transfer-logs", "ui-logs"]
    group_id => "bankapp-group"
  }
}
filter {
  grok {
    match => { "message" => "%{TIME:time} %{LOGLEVEL:log-level}%{SPACE}: %{GREEDYDATA:msg}\n" }
  }
}
output {
  stdout {
    codec => rubydebug
  }
}
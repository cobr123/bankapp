input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["accounts-logs", "blocker-logs", "cash-logs", "exchange-logs", "exchange-generator-logs", "notifications-logs", "transfer-logs", "ui-logs"]
    group_id => "bankapp-group"
  }
}
filter {
  grok {
    match => { "message" => "%{TIME:time} %{LOGLEVEL:log-level}%{SPACE}: %{GREEDYDATA:msg}\n" }
  }
  mutate {
    copy => { "[@metadata][kafka][topic]" => "source"}
  }
  mutate {
    remove_field => [ "username", "event", "message", "@version", "@timestamp" ]
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{source}-%{+YYYY.MM.dd}"
    retry_on_conflict => 3
    action => "index"
    workers => 4
  }
}